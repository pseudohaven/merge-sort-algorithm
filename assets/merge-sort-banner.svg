<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Merge Sort</title>
  <desc id="d">Animated bars split into single elements, then merge back into sorted order.</desc>
  <style>
    /*ANIM*/
    .bar { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .b38 { animation-name: k38; } .b27 { animation-name: k27; }
    .b43 { animation-name: k43; } .b3  { animation-name: k3; }
    .bar rect { animation: fillc 12s infinite; }
    @keyframes fillc { 0%,24% {fill:#FFC857} 44%,52% {fill:#7EE0C3} 64%,72% {fill:#B9A7FF} 86%,100% {fill:#FF5D8F} }
    @keyframes k38 {
      0% {transform:translate(0,0);opacity:0} 4% {transform:translate(0,0);opacity:1} 14% {transform:translate(0,0)}
      24%,34% {transform:translate(-40px,0)} 44%,52% {transform:translate(-70px,0)}
      58% {transform:translate(-13px,-34px)} 64%,72% {transform:translate(44px,0)}
      86%,94% {transform:translate(168px,0);opacity:1} 97% {transform:translate(168px,0);opacity:0}
      98%,100% {transform:translate(0,0);opacity:0} }
    @keyframes k27 {
      0% {transform:translate(0,0);opacity:0} 4% {transform:translate(0,0);opacity:1} 14% {transform:translate(0,0)}
      24%,34% {transform:translate(-40px,0)} 44%,52% {transform:translate(-20px,0)}
      64%,72% {transform:translate(-124px,0)} 86%,94% {transform:translate(0,0);opacity:1}
      97% {transform:translate(0,0);opacity:0} 98%,100% {transform:translate(0,0);opacity:0} }
    @keyframes k43 {
      0% {transform:translate(0,0);opacity:0} 4% {transform:translate(0,0);opacity:1} 14% {transform:translate(0,0)}
      24%,34% {transform:translate(40px,0)} 44%,52% {transform:translate(20px,0)}
      58% {transform:translate(72px,-34px)} 64%,72% {transform:translate(124px,0)}
      86%,94% {transform:translate(84px,0);opacity:1} 97% {transform:translate(84px,0);opacity:0}
      98%,100% {transform:translate(0,0);opacity:0} }
    @keyframes k3 {
      0% {transform:translate(0,0);opacity:0} 4% {transform:translate(0,0);opacity:1} 14% {transform:translate(0,0)}
      24%,34% {transform:translate(40px,0)} 44%,52% {transform:translate(70px,0)}
      64%,72% {transform:translate(-44px,0)} 80% {transform:translate(-148px,-240px)}
      86%,94% {transform:translate(-252px,0);opacity:1} 97% {transform:translate(-252px,0);opacity:0}
      98%,100% {transform:translate(0,0);opacity:0} }
    .c1 { animation: c1 12s infinite; } .c2 { animation: c2 12s infinite; } .c3 { animation: c3 12s infinite; }
    @keyframes c1 { 0%,16% {opacity:0} 22%,48% {opacity:1} 52%,100% {opacity:0} }
    @keyframes c2 { 0%,54% {opacity:0} 58%,70% {opacity:1} 74%,100% {opacity:0} }
    @keyframes c3 { 0%,76% {opacity:0} 80%,94% {opacity:1} 97%,100% {opacity:0} }
    .drift { animation: drift 16s linear infinite; }
    .drift2 { animation: drift 22s linear infinite; animation-delay: -8s; }
    @keyframes drift { 0% {transform:translateY(40px);opacity:0} 15%,85% {opacity:.13} 100% {transform:translateY(-640px);opacity:0} }
    @media (prefers-reduced-motion: reduce) { .bar, .bar rect, .c1, .c2, .c3, .drift, .drift2 { animation: none; } .c1 { opacity:1 } }
    /*ENDANIM*/
    text { font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; }
  </style>

  <rect width="1280" height="640" fill="#1A1D4A"/>
  <circle cx="1230" cy="20" r="230" fill="none" stroke="#2A2F75" stroke-width="2"/>
  <circle cx="1230" cy="20" r="160" fill="none" stroke="#2A2F75" stroke-width="2"/>
  <circle cx="30" cy="640" r="200" fill="none" stroke="#2A2F75" stroke-width="2"/>

  <!-- drifting background numbers -->
  <g fill="#F6F4FF" font-size="54" font-weight="700">
    <text class="drift" x="560" y="640" style="font-family:'Trebuchet MS',Verdana,sans-serif">12</text>
    <text class="drift2" x="1130" y="640" style="font-family:'Trebuchet MS',Verdana,sans-serif">7</text>
    <text class="drift" x="30" y="640" style="font-family:'Trebuchet MS',Verdana,sans-serif;animation-delay:-6s">91</text>
    <text class="drift2" x="450" y="640" style="font-family:'Trebuchet MS',Verdana,sans-serif;animation-delay:-14s">5</text>
  </g>

  <!-- title block -->
  <text x="80" y="250" font-size="104" font-weight="800" fill="#F6F4FF">Merge Sort</text>
  <text x="84" y="316" font-size="36" fill="#B9A7FF">Divide and conquer in Python</text>
  <g font-size="26" font-weight="700">
    <rect x="84" y="364" width="170" height="54" rx="27" fill="none" stroke="#FFC857" stroke-width="3"/>
    <text x="169" y="400" text-anchor="middle" fill="#FFC857">Python</text>
    <rect x="272" y="364" width="250" height="54" rx="27" fill="none" stroke="#7EE0C3" stroke-width="3"/>
    <text x="397" y="400" text-anchor="middle" fill="#7EE0C3">O(n log n)</text>
  </g>

  <!-- visual: bars -->
  <line x1="640" y1="470" x2="1150" y2="470" stroke="#F6F4FF" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(752,470)"><g class="bar b38">
    <rect x="0" y="-181" width="64" height="181" rx="8" fill="#FFC857"/>
    <text x="32" y="-195" text-anchor="middle" font-size="30" font-weight="700" fill="#F6F4FF">38</text></g></g>
  <g transform="translate(836,470)"><g class="bar b27">
    <rect x="0" y="-131" width="64" height="131" rx="8" fill="#FFC857"/>
    <text x="32" y="-145" text-anchor="middle" font-size="30" font-weight="700" fill="#F6F4FF">27</text></g></g>
  <g transform="translate(920,470)"><g class="bar b43">
    <rect x="0" y="-203" width="64" height="203" rx="8" fill="#FFC857"/>
    <text x="32" y="-217" text-anchor="middle" font-size="30" font-weight="700" fill="#F6F4FF">43</text></g></g>
  <g transform="translate(1004,470)"><g class="bar b3">
    <rect x="0" y="-24" width="64" height="24" rx="8" fill="#FFC857"/>
    <text x="32" y="-38" text-anchor="middle" font-size="30" font-weight="700" fill="#F6F4FF">3</text></g></g>

  <!-- stage captions -->
  <g font-size="34" font-weight="700" fill="#F6F4FF" text-anchor="middle">
    <text class="c1" x="895" y="540" fill="#7EE0C3">divide</text>
    <text class="c2" x="895" y="540" fill="#B9A7FF" opacity="0">merge pairs</text>
    <text class="c3" x="895" y="540" fill="#FF5D8F" opacity="0">merge halves: sorted</text>
  </g>
</svg>
